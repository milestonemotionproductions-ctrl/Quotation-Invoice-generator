<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milestone Motion – Quotation & Invoice Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
:root{--bg:#f3f3f1;--pn:#fff;--tx:#17171a;--mu:#6b6b73;--bd:#dcdcd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--pn:#1c1c20;--tx:#eee;--mu:#9a9aa3;--bd:#34343a}}
:root[data-theme="dark"]{--bg:#121214;--pn:#1c1c20;--tx:#eee;--mu:#9a9aa3;--bd:#34343a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:16px;padding:16px;max-width:1320px;margin:auto}
@media(max-width:920px){.app{grid-template-columns:1fr}}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px}
h1{font-size:17px;margin:0 0 4px}h3{font-size:13px;margin:16px 0 4px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.r{display:flex;gap:6px;align-items:center}.r>*{flex:1}
.it{display:grid;grid-template-columns:1fr 44px 64px 58px 28px;gap:4px;margin-bottom:4px}
.it input{padding:6px 5px}
button{padding:8px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:#d4141c;border-color:#d4141c;color:#fff;font-weight:600}
details{margin-top:12px}summary{cursor:pointer;font-weight:600}
#st{font-size:12px;color:var(--mu);min-height:16px;margin-top:6px}
#box{overflow:hidden;border:1px solid var(--bd);border-radius:6px;background:#fff}
#wr{width:800px;transform-origin:top left}
/* document */
#doc{width:800px;min-height:1131px;position:relative;background:#fff;color:#111;font-family:Inter,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#doc *{box-sizing:border-box}
.hd{position:absolute;left:0;top:0;width:800px;height:250px;background:linear-gradient(105deg,#050505 0,#050505 55%,#d4141c 55%,#d4141c 58%,#2b2b2f 58%,#55555a 100%)}
.hl{position:absolute;left:0;top:250px;width:800px;height:5px;background:linear-gradient(90deg,#8e0a10,#e1232c)}
.lg{position:absolute;left:30px;top:32px;width:104px}
.bn{position:absolute;left:156px;top:30px;font:800 31px/1.06 Montserrat,sans-serif;color:#fff;border-left:2px solid #fff;padding-left:18px}
.tg{position:absolute;left:30px;top:196px;font-style:italic;font-size:17px;color:#fff;font-weight:500}
.mk{position:absolute;right:16px;top:16px;width:318px;height:440px;z-index:3}
.mk div.t{position:absolute;background-repeat:no-repeat;background-position:center}
.mk div.c{border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.ph{position:absolute;inset:0;border:2px dashed #aaa;border-radius:10px;color:#ccc;display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center}
.ti{position:absolute;left:0;top:268px;width:470px;height:56px;background:linear-gradient(180deg,#e0212a,#a80b12);font:800 44px/56px Montserrat,sans-serif;color:#fff;padding-left:30px;z-index:2}
.sl{position:absolute;left:486px;top:268px;width:14px;height:56px;background:#d4141c;transform:skewX(-28deg);z-index:2}
.sl+.sl{left:512px;width:8px}
.ct{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:342px 24px 0}
.pf{display:inline-block;align-self:flex-start;background:#d4141c;color:#fff;font-weight:700;font-size:17px;padding:4px 18px;border-radius:20px}
.cn{font:700 28px/1.2 Inter,sans-serif;margin:8px 0 10px;max-width:430px}
.ln{font-weight:600;font-size:18px;margin:5px 0}.ln.s{font-size:15px;color:#555;font-weight:500}
.rl{height:2px;width:440px;background:linear-gradient(90deg,#d4141c,transparent);margin:10px 0 0}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
th{background:#c8101a;color:#fff;padding:9px 6px;font-size:15px;border:1px solid #fff}
td{border:1px solid #888;padding:7px 8px;text-align:center}td.l{text-align:left}td b{font-weight:700}
.tt td{background:linear-gradient(180deg,#d4141c,#a80b12);color:#fff;font:800 24px Montserrat,sans-serif;padding:8px}
.th{display:inline-block;background:#d4141c;color:#fff;font-weight:700;font-size:19px;padding:5px 20px;border-radius:20px;margin:18px 0 8px;align-self:flex-start}
.tm{list-style:none;padding:0;margin:0;font-size:15px;font-weight:500}
.tm li{margin:5px 0;padding-left:30px;position:relative}
.tm li:before{content:"✓";position:absolute;left:0;top:0;width:19px;height:19px;border-radius:50%;background:#d4141c;color:#fff;font-size:12px;text-align:center;line-height:19px}
.ft{margin-top:auto;display:flex;gap:18px;padding:22px 0 16px;align-items:center}
.ft .a{font-size:13px}.ft .a b{display:block;font:700 15px Inter;color:#d4141c}.ft .a strong{font-size:19px;display:block;margin:2px 0}
.ft .c{border-left:2px solid #d4141c;padding-left:14px;font-size:13px;line-height:1.7}
.ft .q{margin-left:auto;font:italic 700 22px/1.2 Inter;text-align:right;color:#111}
.sv{background:#0b0b0b;border-top:5px solid #d4141c;color:#fff;font-size:12px;padding:15px 20px;text-align:center;margin:0 -24px}
.sv i{display:inline-block;width:1px;height:14px;background:#d4141c;margin:0 12px;vertical-align:middle}
</style></head>
<body><div class="app">
<div class="pn">
<h1>Quotation &amp; Invoice Generator</h1><div style="color:var(--mu);font-size:12px">Milestone Motion Productions. Changes show live on the right.</div>
<div class="r"><div><label>Document</label><select id="type"><option value="QTN">Quotation</option><option value="INV">Invoice</option></select></div><div><label>Number</label><input id="seq" type="number" min="1"></div><div><label>Date</label><input id="date" type="date"></div></div>
<label>Client</label><input id="client" list="cl"><datalist id="cl"></datalist>
<div class="r"><div><label>Reference (optional)</label><input id="ref" placeholder="e.g. MMP/QTN/008"></div><div><label>Add-on label</label><input id="addLabel" placeholder="e.g. Heat Press"></div></div>
<h3>Items</h3><div style="font-size:11px;color:var(--mu)" class="it"><span>Description</span><span>Qty</span><span>Price</span><span>Add-on</span><span></span></div>
<div id="items"></div><datalist id="il"></datalist>
<button id="add">+ Add item</button>
<h3>Mockup / project images</h3>
<input id="file" type="file" accept="image/*" multiple>
<div class="r"><select id="fit"><option value="contain">Fit whole image</option><option value="cover">Fill frame</option></select><label style="margin:0;display:flex;gap:6px;align-items:center"><input id="show" type="checkbox" style="width:auto" checked>Show</label><button id="clr">Clear</button></div>
<div style="font-size:11px;color:var(--mu);margin-top:4px">Up to 4 images (any project). Transparent PNGs blend into the header.</div>
<h3>Terms (one per line)</h3><textarea id="terms" rows="5"></textarea>
<details><summary>Business details</summary>
<label>Prepared by</label><input id="by"><label>Business name</label><input id="org"><label>Tagline</label><input id="tag">
<label>Phone</label><input id="phone"><label>WhatsApp</label><input id="wa"><label>Email</label><input id="email">
<label>Services bar (separate with |)</label><input id="services"></details>
<div class="r" style="margin-top:14px"><button id="cv">Convert to invoice</button><button id="nw">New document</button></div>
<div class="r" style="margin-top:8px"><button class="p" id="png">Download PNG</button><button class="p" id="pdf">Download PDF</button></div>
<div id="st"></div></div>
<div><div id="box"><div id="wr"><div id="doc"></div></div></div></div>
</div>

function sync(){K.forEach(k=>$(k).value=S[k]);$('show').checked=S.show;$('cl').innerHTML=cat.c.map(c=>`<option value="${esc(c)}">`).join('');$('il').innerHTML=Object.keys(cat.i).map(c=>`<option value="${esc(c)}">`).join('')}
function ed(){$('items').innerHTML=S.items.map((x,i)=>`<div class="it"><input list="il" data-i="${i}" data-f="d" value="${esc(x.d)}"><input type="number" data-i="${i}" data-f="q" value="${x.q}"><input type="number" data-i="${i}" data-f="p" value="${x.p}"><input type="number" data-i="${i}" data-f="a" value="${x.a}"><button data-x="${i}">×</button></div>`).join('')}
function r(){
 const inv=S.type==='INV',tot=S.items.reduce((s,x)=>s+x.q*(+x.p+ +x.a),0);
 const dt=S.date?new Date(S.date+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';
 const n=Math.min(imgs.length,4),mk=!S.show?'':n?L[n].map((p,i)=>`<div class="t ${S.fit==='cover'?'c':''}" style="left:${p[0]}%;top:${p[1]}%;width:${p[2]}%;height:${p[3]}%;background-image:url(${imgs[i]});background-size:${S.fit}"></div>`).join(''):'<div class="ph" data-html2canvas-ignore>Mockup image slot<br>(upload any project image)</div>';
 const rows=S.items.map((x,i)=>`<tr><td>${i+1}</td><td class="l">${esc(x.d)}</td><td>${x.q}</td><td>${+x.a>0?`KSh ${f(x.p)} + KSh ${f(x.a)}<br>(${esc(S.addLabel)}) = KSh ${f(+x.p+ +x.a)}`:`KSh ${f(x.p)}`}</td><td><b>KSh ${f(x.q*(+x.p+ +x.a))}</b></td></tr>`).join('');
 $('doc').innerHTML=`<div class="hd"></div><div class="hl"></div><img class="lg" src="${LOGO}"><div class="bn">${esc(S.org).toUpperCase().replace(/ (?=\S+$)/,'<br>')}</div><div class="tg">${esc(S.tag)}</div><div class="mk">${mk}</div>
<div class="ti">${inv?'INVOICE':'QUOTATION'}</div><div class="sl"></div><div class="sl"></div>
<div class="ct"><div class="pf">${inv?'Billed To:':'Prepared For:'}</div><div class="cn">${esc(S.client)||'&nbsp;'}</div>
<div class="ln">Date: ${dt}</div><div class="ln">${inv?'Invoice':'Quotation'} No.: ${num()}</div>${S.ref?`<div class="ln s">Ref.: ${esc(S.ref)}</div>`:''}<div class="rl"></div>
<table><tr><th style="width:48px">No.</th><th>Description</th><th style="width:66px">Qty</th><th style="width:196px">Unit Price (KSh)</th><th style="width:150px">Line Total (KSh)</th></tr>${rows}<tr class="tt"><td colspan="4">${inv?'TOTAL DUE':'GRAND TOTAL'}</td><td>KSh ${f(tot)}</td></tr></table>
<div class="th">Terms &amp; Conditions</div><ul class="tm">${S.terms.split('\n').filter(Boolean).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
<div class="ft"><div class="a"><b>Prepared By:</b><strong>${esc(S.by)}</strong>${esc(S.org)}</div><div class="c">Calling: ${esc(S.phone)}<br>WhatsApp: ${esc(S.wa)}<br>Email: ${esc(S.email)}</div><div class="q">Let’s Create<br>Something<br>Great Together.</div></div>
<div class="sv">${S.services.split('|').map(esc).join('<i></i>')}</div></div>`;
 fit();try{localStorage.setItem('mmpS',JSON.stringify(S))}catch(e){}
}
function fit(){const s=Math.min(1,($('box').clientWidth-2)/800);$('wr').style.transform=`scale(${s})`;$('box').style.height=($('doc').offsetHeight*s+2)+'px'}
addEventListener('resize',fit);
K.forEach(k=>$(k).addEventListener('input',()=>{const v=$(k).value;S[k]=k==='seq'?+v:v;if(k==='type'){const o=v==='INV'?T.QTN:T.INV;if(S.terms===o){S.terms=T[v];sync()}}r()}));
$('show').onchange=()=>{S.show=$('show').checked;r()};
$('items').addEventListener('input',e=>{const t=e.target,x=S.items[t.dataset.i];if(!x)return;x[t.dataset.f]=t.dataset.f==='d'?t.value:+t.value;if(t.dataset.f==='d'&&cat.i[t.value]&&!x.p){x.p=cat.i[t.value].p;x.a=cat.i[t.value].a;ed()}r()});
$('items').addEventListener('click',e=>{if(e.target.dataset.x!==undefined){S.items.splice(+e.target.dataset.x,1);ed();r()}});
$('add').onclick=()=>{S.items.push({d:'',q:1,p:0,a:0});ed();r()};
$('file').onchange=async e=>{for(const fl of [...e.target.files].slice(0,4)){const u=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(fl)});imgs.push(u)}imgs=imgs.slice(-4);e.target.value='';r()};
$('clr').onclick=()=>{imgs=[];r()};
$('cv').onclick=()=>{if(S.type==='INV')return;S.ref=num();S.type='INV';if(S.terms===T.QTN)S.terms=T.INV;sync();r()};
$('nw').onclick=()=>{S.seq=+S.seq+1;S.ref='';S.client='';S.items=[{d:'',q:1,p:0,a:0}];imgs=[];sync();ed();r()};
async function exp(kind){
 const st=$('st');st.textContent='Preparing…';
 try{const dl=await window.claude?.use('downloads');if(!dl){st.textContent='Downloads aren’t available in this view.';return}
 await document.fonts.ready;const w=$('wr'),old=w.style.transform;w.style.transform='none';
 const c=await html2canvas($('doc'),{scale:2,useCORS:true,backgroundColor:'#fff'});w.style.transform=old;
 const nm=`${S.type==='INV'?'Invoice':'Quotation'}_${num().replace(/\//g,'-')}_${(S.client||'client').replace(/[^\w]+/g,'_')}`;
 if(kind==='png')await dl.save({filename:nm+'.png',data:await new Promise(r=>c.toBlob(r,'image/png'))});
 else{const h=$('doc').offsetHeight,p=new window.jspdf.jsPDF({unit:'px',format:[800,h],orientation:h>800?'p':'l',hotfixes:['px_scaling']});p.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,800,h);await dl.save({filename:nm+'.pdf',data:p.output('blob')})}
 if(S.client&&!cat.c.includes(S.client))cat.c.push(S.client);S.items.forEach(x=>{if(x.d)cat.i[x.d]={p:x.p,a:x.a}});try{localStorage.setItem('mmpC',JSON.stringify(cat))}catch(e){}sync();
 st.textContent='Saved.'}catch(e){fit();st.textContent=e&&e.code==='declined'?'Download cancelled.':'Export failed: '+(e&&e.message||e)}
}
$('png').onclick=()=>exp('png');$('pdf').onclick=()=>exp('pdf');
sync();ed();r();document.fonts.ready.then(fit);
</script></body></html>
